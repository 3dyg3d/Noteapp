plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.geodesicink'
version = '0.1.0'

android {
  namespace "expo.modules.geodesicink"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Front-buffered (low-latency) rendering: CanvasFrontBufferedRenderer.
  implementation "androidx.graphics:graphics-core:1.0.4"
}
